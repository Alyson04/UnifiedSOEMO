<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Unified SOEMO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="register-bg"></div>
    <main class="register-container">
        <h1 class="register-title">REGISTER</h1>
        <form class="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="lastName">Last Name*</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="firstName">First Name*</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="middleName">Middle Name*</label>
                    <input type="text" id="middleName" name="middleName" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="birthdate">Birthdate*</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender*</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="email">Email Address*</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="course">Course*</label>
                    <input type="text" id="course" name="course" required>
                </div>
                <div class="form-group">
                    <label for="yearSection">Year/Section*</label>
                    <input type="text" id="yearSection" name="yearSection" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="hobbies">Hobbies/Interests</label>
                    <input type="text" id="hobbies" name="hobbies">
                </div>
                <div class="form-group">
                    <label for="portfolio">Portfolio (G-drive link or PDF file)*</label>
                    <input type="text" id="portfolio" name="portfolio" placeholder="Paste link or upload file" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="reason">Reason for Joining</label>
                    <textarea id="reason" name="reason" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </main>
</body>
</html>
